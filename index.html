<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clinical Trial Finder</title>
<meta name="description" content="Beta tools for finding open clinical trials: cancer, neurological conditions and other health conditions. Not medical advice.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230f5c72'/%3E%3Ccircle cx='14' cy='14' r='6' fill='none' stroke='white' stroke-width='3'/%3E%3Cpath d='M18.5 18.5l6 6' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app/style.css">
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><b>Clinical Trial Finder</b><span id="sub"></span></div>
  <span class="pill" id="pill">Beta</span>
  <div class="lang" role="group" aria-label="Language" id="langGroup">
    <button id="lang-en" aria-pressed="true" lang="en">EN</button>
    <button id="lang-fr" aria-pressed="false" lang="fr">FR</button>
  </div>
</div></header>
<div class="wrap">
  <main>
    <section class="panel">
      <h1 id="h1"></h1>
      <p class="lede" id="lede"></p>
      <div class="areas">
        <a class="areacard" href="oncology/"><b data-t="onc"></b><span class="n" data-n="oncology">…</span><span data-t="oncP"></span><span class="go" data-t="go"></span></a>
        <a class="areacard" href="neurology/"><b data-t="neu"></b><span class="n" data-n="neurology">…</span><span data-t="neuP"></span><span class="go" data-t="go"></span></a>
        <a class="areacard" href="other/"><b data-t="oth"></b><span class="n" data-n="other">…</span><span data-t="othP"></span><span class="go" data-t="go"></span></a>
      </div>
      <p class="help" id="note"></p>
    </section>
  </main>
  <footer>
    <p id="foot"></p>
    <p>© 2026 Salish Seven LLC. All rights reserved. Salish Seven™ is a trademark of Salish Seven LLC.</p>
  </footer>
</div>
<script src="app/settings.js"></script>
<script src="app/country.js"></script>
<script>
"use strict";
const T = {
  en: { sub: `${COUNTRY.name[0]} · Beta`, h1: `Find clinical trials ${COUNTRY.inName[0]}`,
        lede: "Choose an area to search open clinical trials and studies near you. Each finder shows every site's status and contact and the full eligibility criteria, so you can raise the right studies with your care team.",
        onc: "Cancer", oncP: "All types of cancer, including blood cancers and childhood cancers.",
        neu: "Neurological conditions", neuP: "Stroke, epilepsy, MS, Parkinson's, dementia, migraine, ALS and more.",
        oth: "Other conditions", othP: "Heart, lungs, diabetes, mental health, infections, pregnancy, rare diseases and healthy volunteers.",
        go: "Open the finder →", studies: n => `${n.toLocaleString(COUNTRY.locale[0])} open studies`,
        note: d => `Beta. Not medical advice. Data from ClinicalTrials.gov, updated daily${d ? ` (last update ${d})` : ""}. In an emergency, call 911.`,
        foot: `Operated by ${ORG.name}. Not affiliated with or endorsed by ClinicalTrials.gov or the U.S. National Library of Medicine.` },
  fr: { sub: `${COUNTRY.name[1]} · Bêta`, h1: `Trouver des essais cliniques ${COUNTRY.inName[1]}`,
        lede: "Choisissez un domaine pour chercher des essais et des études ouverts près de chez vous. Chaque outil indique le statut et le contact de chaque site et les critères d'admissibilité complets.",
        onc: "Cancer", oncP: "Tous les types de cancer, y compris les cancers du sang et de l'enfant.",
        neu: "Affections neurologiques", neuP: "AVC, épilepsie, SEP, Parkinson, démence, migraine, SLA et plus.",
        oth: "Autres affections", othP: "Cœur, poumons, diabète, santé mentale, infections, grossesse, maladies rares et volontaires en santé.",
        go: "Ouvrir l'outil →", studies: n => `${n.toLocaleString(COUNTRY.locale[1])} études ouvertes`,
        note: d => `Bêta. Ne constitue pas un avis médical. Données de ClinicalTrials.gov, mises à jour chaque jour${d ? ` (dernière mise à jour : ${d})` : ""}. En cas d'urgence, composez le 911.`,
        foot: `Exploité par ${ORG.name}. Non affilié à ClinicalTrials.gov ni à la National Library of Medicine des États-Unis, et non approuvé par eux.` }
};
let lang = "en", META = null;
function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.getElementById("langGroup").hidden = COUNTRY.langs.length < 2;
  document.getElementById("sub").textContent = t.sub;
  document.getElementById("pill").textContent = lang === "fr" ? "Bêta" : "Beta";
  document.getElementById("h1").textContent = t.h1;
  document.getElementById("lede").textContent = t.lede;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t[el.dataset.t]);
  document.querySelectorAll("[data-n]").forEach(el => { const a = META && META.areas && META.areas[el.dataset.n]; el.textContent = a ? t.studies(a.studies) : "…"; });
  const d = META ? new Date(META.built).toLocaleDateString(COUNTRY.locale[lang === "fr" ? 1 : 0], { year: "numeric", month: "short", day: "numeric" }) : "";
  document.getElementById("note").textContent = t.note(d);
  document.getElementById("foot").textContent = t.foot;
  document.getElementById("lang-en").setAttribute("aria-pressed", lang === "en");
  document.getElementById("lang-fr").setAttribute("aria-pressed", lang === "fr");
}
document.getElementById("lang-en").onclick = () => { lang = "en"; render(); };
document.getElementById("lang-fr").onclick = () => { lang = "fr"; render(); };
render();
fetch("data/meta.json").then(r => r.ok ? r.json() : null).then(m => { META = m; render(); }).catch(() => {});
</script>
</body>
</html>
